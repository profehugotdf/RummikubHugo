<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Rummikub</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { color-scheme: light only; }
  body { font-family: sans-serif; margin:0; padding:6px; background:#1b3d1b; color:#eee; font-size:15px; }
  h2 { margin:4px 0; font-size:20px; }
  input[type=text], input[type=number] { width:100%; padding:10px; font-size:15px; border-radius:8px; border:none; margin:5px 0; box-sizing:border-box; }
  textarea { width:100%; height:60px; font-size:13px; box-sizing:border-box; margin:6px 0; background:#fff !important; color:#000 !important; }
  button { padding:11px; margin:5px 0; width:100%; font-size:15px; border-radius:8px; border:none; background:#4caf50; color:white; }
  button:disabled { background:#777; opacity:.6; }
  .btnSec { background:#1565c0; }
  .paso { background:#2a5a2a; padding:8px; border-radius:10px; margin:6px 0; }
  .paso.mesaWrap { padding:4px; }
  .titulo { font-weight:bold; font-size:16px; margin-bottom:4px; color:#fff; }
  .oculto { display:none; }
  #log { background:#000; color:#0f0; padding:6px; font-size:11px; min-height:26px; border-radius:8px; white-space:pre-wrap; max-height:56px; overflow-y:auto; }
  #diag { background:#111; color:#7fdfff; padding:6px; font-size:11px; border-radius:8px; white-space:pre-wrap; max-height:220px; overflow-y:auto; margin:6px 0; font-family:monospace; }
  #codigoMostrado { font-size:32px; font-weight:900; text-align:center; letter-spacing:2px; background:#fff; color:#000; padding:14px; border-radius:10px; margin:8px 0; }
  .rol { font-size:18px; padding:16px; }
  #marcador { text-align:center; font-size:14px; padding:6px; background:#154; border-radius:8px; margin:4px 0; color:#fff; }
  #reloj { text-align:center; padding:6px; border-radius:8px; margin:4px 0; color:#fff; font-weight:bold; background:#333; }
  #estadoTurno { font-weight:bold; font-size:17px; text-align:center; padding:7px; border-radius:8px; margin:5px 0; }
  .miTurno { background:#2e7d32; }
  .turnoRival { background:#8a5a00; }
  #msgValidacion { text-align:center; padding:7px; border-radius:8px; margin:5px 0; font-weight:bold; font-size:14px; }
  .malo { background:#a11; }
  .bueno { background:#161; }
  .botonera { display:flex; gap:6px; }
  .botonera button { margin:5px 0; }
  #btnDeshacer { background:#c0392b; }
  #btnOrdenar { background:#6a1b9a; }
  #btnSincronizar { background:#00695c; font-size:13px; padding:7px; }
  #btnNuevaPartida { background:#0277bd; font-size:17px; padding:14px; }
  #aviso { background:#1565c0; color:#fff; padding:9px; border-radius:8px; margin:6px 0; }
  .detalle { font-size:13px; color:#cde; }
  .radioLinea { color:#fff; display:block; margin:6px 0; font-size:14px; }

  #mesa { display:grid; grid-template-columns:repeat(21, minmax(0,1fr)); gap:1px; background:#0d3d0d; padding:2px; border-radius:6px; }
  #mesa .celda { aspect-ratio:3/4; background:rgba(255,255,255,.05); border-radius:2px; }
  #mesa .ficha { font-size:clamp(8px, 2.5vw, 19px); font-weight:900; border-radius:2px; box-shadow:0 1px 1px rgba(0,0,0,.4); }

  #atril { display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:3px; background:#0d260d; padding:5px; border-radius:8px; }
  #atril .celda { aspect-ratio:3/4; background:rgba(255,255,255,.07); border-radius:4px; }
  #atril .ficha { font-size:clamp(14px, 4.4vw, 27px); font-weight:900; border-radius:4px; box-shadow:0 2px 3px rgba(0,0,0,.45); }

  .celda { position:relative; }
  .ficha { width:100%; height:100%; background:#f5f0e1 !important; display:flex; align-items:center; justify-content:center; font-weight:900; touch-action:none; user-select:none; text-shadow:0 0 1px rgba(0,0,0,.25); }
  .c-rojo   { color:#e60000 !important; background:#ffecec !important; }
  .c-azul   { color:#0047d6 !important; background:#e8f0ff !important; }
  .c-negro  { color:#000000 !important; background:#e2e2e2 !important; }
  .c-naranja{ color:#b58900 !important; background:#fffbe0 !important; }
  .comodin{ color:#c0392b !important; }
  .arrastrando { opacity:.4; }
  .celda.resaltada { background:rgba(255,255,0,.4); }
  .celda.replay { background:rgba(0,150,255,.5); }
  .celda.invalida { background:rgba(255,0,0,.5); }
  .celda.nueva { outline:2px solid #00e5ff; }
  .ficha.seleccionada { outline:3px solid #ffeb3b; box-shadow:0 0 8px 2px #ffeb3b !important; }
  .bloqueado { pointer-events:none; opacity:.9; }

  @media (max-height: 520px) and (max-width: 719px) {
    h2 { display:none; }
    #zonaEstado { padding:3px; margin:2px 0; }
    #log { max-height:20px; min-height:0; font-size:9px; }
    #estadoTurno { font-size:13px; padding:3px; margin:2px 0; }
    #msgValidacion { font-size:11px; padding:3px; margin:2px 0; }
    .paso { padding:4px; margin:3px 0; }
    #zonaJuego .titulo { font-size:12px; margin-bottom:2px; }
    #zonaJuego button { padding:6px; margin:2px 0; font-size:12px; }
    #btnSincronizar { font-size:10px; padding:4px; }
  }

  @media (orientation: landscape) and (min-width: 720px) {
    body { padding:3px; }
    h2 { display:none; }
    #zonaEstado { padding:3px; margin:2px 0; }
    #log { max-height:22px; min-height:0; font-size:10px; }
    #zonaJuego { display:grid; grid-template-columns: 1fr 400px; gap:6px; align-items:start; }
    #zonaJuego #estadoTurno, #zonaJuego #marcador, #zonaJuego #reloj { grid-column: 1 / -1; margin:2px 0; padding:3px; font-size:14px; }
    #zonaJuego #msgValidacion { grid-column: 1 / -1; margin:2px 0; padding:3px; font-size:12px; }
    #zonaJuego > .paso:nth-of-type(1) { grid-column: 1; margin:0; }
    #zonaJuego > .paso:nth-of-type(2) { grid-column: 2; margin:0; padding:4px; }
    #mesa { height:66vh; grid-auto-rows:minmax(0,1fr); max-width:calc(66vh / 8 * 0.75 * 21); margin:0 auto; }
    #mesa .celda { aspect-ratio:auto; height:100%; }
    #mesa .ficha { font-size:clamp(8px, 3vh, 20px); }
    #atril { gap:4px; padding:4px; }
    #atril .ficha { font-size:clamp(13px, 1.6vw, 24px); }
    #zonaJuego .titulo { font-size:12px; margin-bottom:2px; }
    #zonaJuego button { padding:5px; margin:2px 0; font-size:12px; }
    #btnNuevaPartida { font-size:13px; padding:7px; }
    #btnSincronizar { font-size:10px; padding:4px; }
  }
</style>
</head>
<body>
  <h2>Rummikub</h2>

  <div id="aviso" class="oculto"></div>
  <div id="diag">diagnóstico: esperando...</div>

  <div id="elegirRol" class="paso">
    <div class="titulo">Tu nombre</div>
    <input type="text" id="miNombreInput" placeholder="Ej: Hugo">
    <div class="titulo" style="margin-top:10px;">Si sos anfitrión, elegí el modo de la serie</div>
    <label class="radioLinea"><input type="radio" name="modoRadio" value="conteo" checked> Solo contar partidas ganadas</label>
    <label class="radioLinea"><input type="radio" name="modoRadio" value="puntaje"> Puntaje acumulado (pierde el que llega a X)</label>
    <input type="number" id="limiteInput" placeholder="Puntaje límite (ej 100)" value="100">
    <div class="titulo" style="margin-top:10px;">Reloj (opcional)</div>
    <label class="radioLinea"><input type="radio" name="relojRadio" value="ninguno" checked> Sin reloj</label>
    <label class="radioLinea"><input type="radio" name="relojRadio" value="arena"> Arena: segundos por turno</label>
    <input type="number" id="arenaInput" placeholder="Segundos por turno (ej 60)" value="60">
    <label class="radioLinea"><input type="radio" name="relojRadio" value="ajedrez"> Ajedrez: minutos totales por jugador</label>
    <input type="number" id="ajedrezInput" placeholder="Minutos totales (ej 5)" value="5">
    <button class="rol" onclick="soyA()">Soy el ANFITRIÓN (reparto yo)</button>
    <button class="rol" onclick="soyB()">Me UNO a la partida</button>
    <button id="btnReconectar" class="oculto btnSec" onclick="reconectar()">Reconectar (recuperé una partida)</button>
    <button id="btnBorrar" class="oculto" style="background:#c0392b" onclick="borrarPartida()">Borrar partida y empezar de cero</button>
  </div>

  <div id="flujoA" class="oculto">
    <div class="paso">
      <div class="titulo">Pasale este código a tu compañero</div>
      <div id="codigoMostrado">...</div>
      <button class="btnSec" onclick="copiarCodigo()">Copiar código</button>
      <div class="detalle">Esperando que se una...</div>
    </div>
  </div>

  <div id="flujoB" class="oculto">
    <div class="paso">
      <div class="titulo">Escribí el código que te pasaron</div>
      <input type="text" id="codigoInput" placeholder="Ej: RMK-7X4QP" style="text-transform:uppercase;">
      <button onclick="conectarB()">Conectar</button>
    </div>
  </div>

  <div id="zonaEstado" class="oculto paso">
    <div id="log">Esperando conexión...</div>
  </div>

  <div id="zonaJuego" class="oculto">
    <div id="marcador"></div>
    <div id="reloj" class="oculto"></div>
    <div id="estadoTurno"></div>
    <div id="msgValidacion" class="oculto"></div>
    <div class="paso mesaWrap">
      <div id="mesa"></div>
    </div>
    <div class="paso">
      <div class="titulo">Atril (<span id="cuenta">0</span>) · Pozo: <span id="pozo">0</span> <span id="abierto"></span></div>
      <div id="atril"></div>
      <button id="btnNuevaPartida" class="oculto" onclick="nuevaPartida()">🔄 Nueva partida</button>
      <button id="btnOrdenar" onclick="ordenarAtril()">↕ Ordenar atril</button>
      <div class="botonera">
        <button id="btnDeshacer" onclick="deshacer()">Deshacer</button>
        <button id="btnEnviar" onclick="enviarJugada()">Enviar jugada</button>
      </div>
      <button id="btnRobar" onclick="robar()">Robar del pozo y pasar</button>
      <button id="btnSincronizar" onclick="pedirEstado()">🔄 Sincronizar (si quedó trabado)</button>
    </div>
  </div>

<script>
/* ---------- Diagnóstico visible ---------- */
const $ = (id)=>document.getElementById(id);
function diag(t){ const d=$('diag'); d.textContent += "\n"+t; d.scrollTop=d.scrollHeight; }
function setDiag(t){ $('diag').textContent=t; }

/* ---------- Persistencia ---------- */
const CLAVE = "rummikub_estado_v7";
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify({ atril, fichasEnPozo, mesa, turnoInicial, numeroTurno, esAnfitrion, yaAbri, pozoReal, nombres, modoJuego, limitePuntaje, victorias, puntos, serieTerminada, ganadorSerie, contadorRival, relojTipo, relojArenaSeg, relojAjedrezMin, tiempoRestante, turnoInicioTS, miCodigo, codigoRival, hayJuego:true })); } catch(e){}
}
function cargarGuardado() { try { const s=localStorage.getItem(CLAVE); return s?JSON.parse(s):null; } catch(e){ return null; } }
function borrarPartida() {
  if(!confirm("¿Borrar la partida guardada y empezar de cero?")) return;
  try{ localStorage.removeItem(CLAVE); }catch(e){}
  location.reload();
}

/* ---------- Wake Lock ---------- */
let wakeLock=null;
async function pedirWakeLock(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
function soltarWakeLock(){ try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){} }

/* ---------- Conexión P2P vía PeerJS (código corto, reintento automático) ---------- */
let peer=null, conn=null, esAnfitrion=false, miCodigo=null, codigoRival=null, intentandoReconectar=false, intentoEnCurso=false;
function log(t){ const l=$('log'); l.textContent += "\n"+t; l.scrollTop=l.scrollHeight; }
function setLog(t){ $('log').textContent=t; }
function mostrarAviso(t){ const a=$('aviso'); a.textContent=t; a.classList.remove('oculto'); }

function generarCodigo(){
  const alfabeto="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s="RMK-";
  for(let i=0;i<5;i++) s+=alfabeto[Math.floor(Math.random()*alfabeto.length)];
  return s;
}

function crearPeer(idDeseado, alAbrir){
  peer = new Peer(idDeseado || undefined, { config:{ iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"},
    {urls:"turn:openrelay.metered.ca:80", username:"openrelayproject", credential:"openrelayproject"},
    {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"},
    {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"},
    {urls:"turn:relay1.expressturn.com:3478", username:"efQUQ79N77B5BRVGTC", credential:"N4EAUgpjMzPLrxSy"}
  ]}});
  peer.on('open',(id)=>{ diag("Peer listo (id "+id+")"); if(alAbrir) alAbrir(id); });
  peer.on('error',(err)=>{
    diag("⚠️ Peer error: "+err.type+(err.message?(" — "+err.message):""));
    if(err.type==="unavailable-id" && esAnfitrion){ miCodigo=generarCodigo(); $('codigoMostrado').textContent=miCodigo; guardar(); crearPeer(miCodigo, alAbrir); }
  });
  peer.on('disconnected',()=>{ diag("Servidor de señalización desconectado, reintentando..."); try{peer.reconnect();}catch(e){} });
  if(esAnfitrion){ peer.on('connection',(c)=>{ diag("Invitado conectándose..."); usarConexion(c); }); }
}

function usarConexion(c){
  conn=c;
  diag("DataConnection creada, esperando abrir...");
  setTimeout(()=>{
    if(conn && conn.peerConnection){
      conn.peerConnection.oniceconnectionstatechange = ()=> diag("ICE: "+conn.peerConnection.iceConnectionState);
      diag("ICE actual: "+conn.peerConnection.iceConnectionState);
    } else {
      diag("⚠️ No pude acceder al RTCPeerConnection interno todavía.");
    }
  }, 300);
  conn.on('open',()=>{
    diag("✅✅ CANAL ABIERTO — ¡conectados!");
    ['elegirRol','flujoA','flujoB'].forEach(id=>$(id).classList.add('oculto'));
    $('diag').classList.add('oculto'); $('aviso').classList.add('oculto');
    $('zonaEstado').classList.remove('oculto'); $('zonaJuego').classList.remove('oculto');
    setLog("✅ ¡Conectado!"); pedirWakeLock(); intentandoReconectar=false; intentoEnCurso=false;
    enviar({tipo:"nombre", id:miId(), nombre:nombres[miId()]});
    if(esAnfitrion && !recuperado) repartir();
    else { render(); actualizarUI(); actualizarMarcador(); pedirEstado(); }
  });
  conn.on('data',(data)=>manejarMensaje(data));
  conn.on('close',()=>{ diag("❌ Conexión cerrada."); soltarWakeLock(); mostrarAviso("Se cortó la conexión. Reintentando automáticamente..."); dispararReintentoAuto(); });
  conn.on('error',(err)=>{ diag("⚠️ error datos: "+(err&&err.type?err.type:err)); });
}
function enviar(o){ if(conn && conn.open) conn.send(o); }
function canalAbierto(){ return !!(conn && conn.open); }

function dispararReintentoAuto(){
  if(esAnfitrion || !codigoRival || intentandoReconectar) return;
  intentandoReconectar=true;
  setTimeout(()=>{
    intentandoReconectar=false;
    if(!canalAbierto() && peer && !peer.destroyed){
      diag("🔄 Reintentando conexión...");
      try{ const c=peer.connect(codigoRival,{reliable:true}); usarConexion(c); }catch(e){}
    }
  }, 3000);
}
setInterval(()=>{
  if(turnoInicial!==null && !partidaTerminada && !esAnfitrion && codigoRival && !canalAbierto()) dispararReintentoAuto();
}, 8000);

function soyA(){
  esAnfitrion=true;
  nombres.A = $('miNombreInput').value.trim() || "Anfitrión";
  modoJuego = document.querySelector('input[name="modoRadio"]:checked').value;
  limitePuntaje = parseInt($('limiteInput').value) || 100;
  relojTipo = document.querySelector('input[name="relojRadio"]:checked').value;
  relojArenaSeg = parseInt($('arenaInput').value) || 60;
  relojAjedrezMin = parseInt($('ajedrezInput').value) || 5;
  miCodigo = generarCodigo();
  $('elegirRol').classList.add('oculto'); $('flujoA').classList.remove('oculto');
  $('codigoMostrado').textContent = miCodigo;
  setDiag("Soy ANFITRIÓN."); guardar();
  crearPeer(miCodigo);
}
function soyB(){
  nombres.B = $('miNombreInput').value.trim() || "Invitado";
  $('elegirRol').classList.add('oculto'); $('flujoB').classList.remove('oculto');
  setDiag("Soy INVITADO.");
}
function conectarB(){
  codigoRival = $('codigoInput').value.trim().toUpperCase();
  if(!codigoRival){ alert("Escribí el código"); return; }
  if(intentoEnCurso){ diag("Ya hay un intento en curso, esperá..."); return; }
  intentoEnCurso=true;
  guardar();
  crearPeer(null, ()=>{
    diag("Intentando conectar a "+codigoRival+"...");
    const c=peer.connect(codigoRival,{reliable:true});
    usarConexion(c);
    setTimeout(()=>{
      if(!canalAbierto()){ diag("⚠️ Sigue sin abrir tras 10s. Probá recargar los dos e intentar de nuevo."); }
      intentoEnCurso=false;
    }, 10000);
  });
}
function copiarCodigo(){ navigator.clipboard.writeText(miCodigo).then(()=>alert("¡Copiado!"),()=>alert("Código: "+miCodigo)); }

function reconectarSilencioso(){
  if(esAnfitrion){
    $('elegirRol').classList.add('oculto'); $('flujoA').classList.remove('oculto');
    $('codigoMostrado').textContent = miCodigo;
    crearPeer(miCodigo);
  } else {
    $('elegirRol').classList.add('oculto'); $('flujoB').classList.remove('oculto');
    crearPeer(null, ()=>{ const c=peer.connect(codigoRival,{reliable:true}); usarConexion(c); });
  }
}
function reconectar(){
  const g=cargarGuardado(); if(!g){alert("No hay partida guardada");return;}
  reconectarSilencioso();
}

/* ---------- Estado ---------- */
const COLORES=["rojo","azul","negro","naranja"];
const MESA_COLS=21, MESA_FILAS=8, MESA_CELDAS=MESA_COLS*MESA_FILAS;
const ATRIL_COLS=10, ATRIL_FILAS=3, ATRIL_CELDAS=ATRIL_COLS*ATRIL_FILAS;
const VEL_REPLAY=400;

let atril=new Array(ATRIL_CELDAS).fill(null);
let mesa=new Array(MESA_CELDAS).fill(null);
let pozoReal=[], fichasEnPozo=0;
let turnoInicial=null, numeroTurno=0;
let reproduciendo=false, recuperado=false, yaAbri=false, partidaTerminada=false;
let inicioReproduccion=0;
let atrilInicioTurno=null, mesaInicioTurno=null, movimientos=[];
let nombres={A:"Jugador A", B:"Jugador B"};
let modoJuego="conteo", limitePuntaje=100;
let victorias={A:0,B:0}, puntos={A:0,B:0};
let serieTerminada=false, ganadorSerie=null;
let contadorRival=14;
let relojTipo="ninguno", relojArenaSeg=60, relojAjedrezMin=5;
let tiempoRestante={A:0,B:0}, turnoInicioTS=null;

function miId(){ return esAnfitrion ? "A" : "B"; }
function rivalId(){ return esAnfitrion ? "B" : "A"; }
function turnoActual(){
  if(!turnoInicial) return null;
  const impar = (numeroTurno % 2) === 1;
  return impar ? turnoInicial : (turnoInicial==="A" ? "B" : "A");
}
function esMiTurno(){ return turnoActual() === miId(); }

function fichasAtril(){ return atril.filter(x=>x); }
function calcularPuntosAtril(){ let s=0; for(const f of fichasAtril()) s += f.comodin?30:f.num; return s; }
function crearMazo(){
  const m=[]; let id=0;
  for(let c=0;c<2;c++) for(const col of COLORES) for(let n=1;n<=13;n++) m.push({id:id++,num:n,color:col});
  m.push({id:id++,comodin:true}); m.push({id:id++,comodin:true}); return m;
}
function mezclar(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function ponerEnAtril(f){ const i=atril.indexOf(null); if(i>=0) atril[i]=f; }

function repartir(){
  const mazo=mezclar(crearMazo());
  const mA=mazo.splice(0,14), mB=mazo.splice(0,14);
  pozoReal=mazo; fichasEnPozo=pozoReal.length;
  turnoInicial = Math.random()<0.5 ? "A" : "B";
  numeroTurno = 1;
  mesa=new Array(MESA_CELDAS).fill(null);
  contadorRival = 14;
  turnoInicioTS = Date.now();
  if(relojTipo==="ajedrez") tiempoRestante = { A: relojAjedrezMin*60, B: relojAjedrezMin*60 };
  enviar({tipo:"reparto",mano:mB,pozo:fichasEnPozo,turnoInicial,numeroTurno,modoJuego,limitePuntaje,relojTipo,relojArenaSeg,relojAjedrezMin,tiempoRestante,ts:turnoInicioTS});
  atril=new Array(ATRIL_CELDAS).fill(null); mA.forEach(f=>ponerEnAtril(f));
  yaAbri=false; partidaTerminada=false; reproduciendo=false;
  $('btnNuevaPartida').classList.add('oculto');
  limpiarValidacion();
  ordenarAtril(true); iniciarTurnoSiCorresponde(); render(); actualizarUI(); actualizarMarcador(); guardar();
}

function nuevaPartida(){
  if(!canalAbierto()){ mostrarAviso("No hay conexión. Recargá y tocá 'Reconectar'."); return; }
  if(serieTerminada){ victorias={A:0,B:0}; puntos={A:0,B:0}; serieTerminada=false; ganadorSerie=null; }
  if(esAnfitrion) repartir();
  else { enviar({tipo:"pedirNuevaPartida"}); log("⏳ Pidiendo nueva partida al anfitrión..."); }
}

function manejarMensaje(msg){
  if(msg.tipo==="nombre"){ nombres[msg.id]=msg.nombre; actualizarUI(); actualizarMarcador(); guardar(); }
  else if(msg.tipo==="reparto"){
    atril=new Array(ATRIL_CELDAS).fill(null); msg.mano.forEach(f=>ponerEnAtril(f));
    mesa=new Array(MESA_CELDAS).fill(null);
    fichasEnPozo=msg.pozo; turnoInicial=msg.turnoInicial; numeroTurno=msg.numeroTurno;
    modoJuego=msg.modoJuego||"conteo"; limitePuntaje=msg.limitePuntaje||100;
    relojTipo=msg.relojTipo||"ninguno"; relojArenaSeg=msg.relojArenaSeg||60; relojAjedrezMin=msg.relojAjedrezMin||5;
    tiempoRestante=msg.tiempoRestante||{A:0,B:0}; turnoInicioTS=msg.ts||Date.now();
    contadorRival=14;
    yaAbri=false; partidaTerminada=false; reproduciendo=false;
    $('btnNuevaPartida').classList.add('oculto');
    limpiarValidacion();
    ordenarAtril(true); iniciarTurnoSiCorresponde(); render(); actualizarUI(); actualizarMarcador(); guardar();
  }
  else if(msg.tipo==="pedirNuevaPartida"){ if(esAnfitrion) repartir(); }
  else if(msg.tipo==="jugada"){ reproducirJugada(msg); }
  else if(msg.tipo==="pedirFicha"){
    if(esAnfitrion){
      const f=pozoReal.shift()||null; fichasEnPozo=pozoReal.length;
      if(relojTipo==="ajedrez"){
        const elapsed=Math.floor((Date.now()-(turnoInicioTS||Date.now()))/1000);
        tiempoRestante[rivalId()]=Math.max(0,(tiempoRestante[rivalId()]||0)-elapsed);
      }
      numeroTurno++;
      turnoInicioTS=Date.now();
      enviar({tipo:"fichaRobada",ficha:f,pozo:fichasEnPozo,numeroTurno,ts:turnoInicioTS,tiempoRestante});
      iniciarTurnoSiCorresponde(); render(); actualizarUI(); guardar();
    }
  }
  else if(msg.tipo==="fichaRobada"){
    if(msg.ficha) ponerEnAtril(msg.ficha);
    fichasEnPozo=msg.pozo; numeroTurno=msg.numeroTurno;
    turnoInicioTS=msg.ts||Date.now(); if(msg.tiempoRestante) tiempoRestante=msg.tiempoRestante;
    enviar({tipo:"conteo", n:fichasAtril().length});
    iniciarTurnoSiCorresponde(); render(); actualizarUI(); guardar();
  }
  else if(msg.tipo==="conteo"){ contadorRival=msg.n; actualizarMarcador(); }
  else if(msg.tipo==="pedirEstado"){
    enviar({tipo:"estado",mesa,pozo:fichasEnPozo,numeroTurno,conteo:fichasAtril().length});
  }
  else if(msg.tipo==="ping"){
    if(msg.numeroTurno > numeroTurno){ enviar({tipo:"pedirEstado"}); }
    else if(msg.numeroTurno < numeroTurno){ enviar({tipo:"estado",mesa,pozo:fichasEnPozo,numeroTurno,conteo:fichasAtril().length}); }
  }
  else if(msg.tipo==="estado"){
    if(msg.conteo!=null){ contadorRival=msg.conteo; actualizarMarcador(); }
    if(msg.numeroTurno > numeroTurno){
      reproduciendo=false;
      mesa=msg.mesa; fichasEnPozo=msg.pozo; numeroTurno=msg.numeroTurno;
      iniciarTurnoSiCorresponde(); render(); actualizarUI(); guardar();
      log("🔄 Sincronizado (turno "+numeroTurno+").");
    }
  }
  else if(msg.tipo==="resultadoMano"){
    puntos[msg.perdedorId] = (puntos[msg.perdedorId]||0) + msg.puntos;
    comprobarFinSerie();
    actualizarMarcador(); guardar();
  }
}
function pedirEstado(){ if(!canalAbierto()){ mostrarAviso("No hay conexión activa."); dispararReintentoAuto(); return; } reproduciendo=false; actualizarUI(); enviar({tipo:"pedirEstado"}); }

function iniciarTurnoSiCorresponde(){
  if(esMiTurno()){ atrilInicioTurno=JSON.parse(JSON.stringify(atril)); mesaInicioTurno=JSON.parse(JSON.stringify(mesa)); movimientos=[]; }
}

/* ---------- Marcador de la serie ---------- */
function comprobarFinSerie(){
  if(modoJuego!=="puntaje") return;
  if((puntos.A||0) >= limitePuntaje){ serieTerminada=true; ganadorSerie="B"; }
  else if((puntos.B||0) >= limitePuntaje){ serieTerminada=true; ganadorSerie="A"; }
}
function actualizarMarcador(){
  const m=$('marcador');
  let txt = nombres.A+": "+victorias.A+" 🏆";
  if(modoJuego==="puntaje") txt += " ("+(puntos.A||0)+"/"+limitePuntaje+" pts)";
  txt += "   |   " + nombres.B+": "+victorias.B+" 🏆";
  if(modoJuego==="puntaje") txt += " ("+(puntos.B||0)+"/"+limitePuntaje+" pts)";
  txt += "   |   Fichas de "+nombres[rivalId()]+": "+contadorRival;
  m.textContent = txt;
}

/* ---------- Reloj ---------- */
function actualizarReloj(){
  const d=$('reloj');
  if(relojTipo==="ninguno" || !turnoInicioTS || partidaTerminada || reproduciendo){ d.classList.add('oculto'); return; }
  d.classList.remove('oculto');
  const elapsed = Math.floor((Date.now()-turnoInicioTS)/1000);
  if(relojTipo==="arena"){
    const restante = relojArenaSeg - elapsed;
    if(restante<=0){ d.textContent="⏰ ¡Se acabó el tiempo del turno de "+nombres[turnoActual()]+"!"; d.style.background="#a11"; }
    else { d.textContent="⏳ "+restante+"s de turno"; d.style.background = restante<=10?"#a11":"#333"; }
  } else if(relojTipo==="ajedrez"){
    const idT = turnoActual();
    const base = (tiempoRestante[idT]||0);
    const restante = Math.max(0, base - elapsed);
    const mm=Math.floor(restante/60), ss=restante%60;
    d.textContent = "⏳ "+nombres[idT]+": "+mm+":"+(ss<10?"0":"")+ss;
    d.style.background = restante<=30?"#a11":"#333";
    if(restante<=0) d.textContent += " — ¡tiempo agotado!";
  }
}
setInterval(actualizarReloj, 1000);

/* ---------- Ordenar atril ---------- */
function ordenarAtril(silencioso){
  const fs=fichasAtril();
  fs.sort((a,b)=>{ if(a.comodin)return 1; if(b.comodin)return -1;
    if(a.color!==b.color) return COLORES.indexOf(a.color)-COLORES.indexOf(b.color); return a.num-b.num; });
  atril=new Array(ATRIL_CELDAS).fill(null);
  fs.forEach((f,i)=>{ atril[i]=f; });
  if(!silencioso){ render(); guardar(); }
}

/* ---------- Validación ---------- */
function obtenerBloques(tab){
  const bl=[];
  for(let f=0;f<MESA_FILAS;f++){ let act=[];
    for(let c=0;c<MESA_COLS;c++){ const i=f*MESA_COLS+c;
      if(tab[i]) act.push({ficha:tab[i],idx:i}); else { if(act.length)bl.push(act); act=[]; } }
    if(act.length)bl.push(act);
  } return bl;
}
function esGrupo(fs){
  if(fs.length<3||fs.length>4) return false;
  const r=fs.filter(x=>!x.ficha.comodin).map(x=>x.ficha); if(!r.length) return false;
  if(!r.every(f=>f.num===r[0].num)) return false;
  const cols=r.map(f=>f.color); return new Set(cols).size===cols.length;
}
function esEscalera(fs){
  if(fs.length<3) return false;
  const r=fs.filter(x=>!x.ficha.comodin).map(x=>x.ficha); if(!r.length) return false;
  if(!r.every(f=>f.color===r[0].color)) return false;
  const p=fs.findIndex(x=>!x.ficha.comodin);
  const ini=fs[p].ficha.num-p;
  if(ini<1||ini+fs.length-1>13) return false;
  for(let i=0;i<fs.length;i++){ if(!fs[i].ficha.comodin && fs[i].ficha.num!==ini+i) return false; }
  return true;
}
function bloqueValido(fs){ return esGrupo(fs)||esEscalera(fs); }

function validarJugada(){
  const bloques = obtenerBloques(mesa);
  const idsNuevos = new Set();
  for(const m of movimientos){ if(m.desdeAtril && m.ficha) idsNuevos.add(m.ficha.id); }

  if(!yaAbri){
    if(movimientos.some(m=>m.origenMesa!=null && !idsNuevos.has(m.ficha.id)))
      return {ok:false,motivo:"En la apertura solo podés bajar fichas de tu atril, sin tocar la mesa."};
    const bloquesTocados = bloques.filter(b => b.some(x => idsNuevos.has(x.ficha.id)));
    if(bloquesTocados.length===0)
      return {ok:false,motivo:"No bajaste ninguna ficha a la mesa."};
    let suma=0;
    for(const b of bloquesTocados){
      if(b.some(x=>!idsNuevos.has(x.ficha.id)))
        return {ok:false,motivo:"Una jugada quedó pegada a otra. Separala con una celda vacía o usá otra fila.",celdas:b.map(x=>x.idx)};
      if(!bloqueValido(b))
        return {ok:false,motivo:"Hay un grupo/escalera inválido en tu apertura.",celdas:b.map(x=>x.idx)};
      for(const x of b){ if(!x.ficha.comodin) suma+=x.ficha.num; }
    }
    if(suma<30) return {ok:false,motivo:"Tu apertura debe sumar al menos 30 (suma "+suma+")."};
    return {ok:true};
  }

  for(const b of bloques){
    if(!bloqueValido(b)) return {ok:false,motivo:"Un grupo/escalera de la mesa quedó inválido. Acomodalo antes de enviar.",celdas:b.map(x=>x.idx)};
  }
  return {ok:true};
}

/* ---------- Turno ---------- */
function deshacer(){
  if(!esMiTurno()) return;
  atril=JSON.parse(JSON.stringify(atrilInicioTurno)); mesa=JSON.parse(JSON.stringify(mesaInicioTurno)); movimientos=[];
  limpiarSeleccion(); limpiarValidacion(); render(); guardar();
}
function enviarJugada(){
  if(!esMiTurno()||partidaTerminada) return;
  if(movimientos.length===0){ mostrarValidacion(false,"No hiciste ninguna jugada. Usá 'Robar del pozo y pasar'."); return; }
  const v=validarJugada();
  if(!v.ok){ mostrarValidacion(false,v.motivo); resaltarInvalidas(v.celdas||[]); return; }
  if(!yaAbri) yaAbri=true;
  limpiarValidacion();
  const gano = fichasAtril().length===0;
  if(relojTipo==="ajedrez"){
    const elapsed=Math.floor((Date.now()-(turnoInicioTS||Date.now()))/1000);
    tiempoRestante[miId()]=Math.max(0,(tiempoRestante[miId()]||0)-elapsed);
  }
  numeroTurno++;
  turnoInicioTS=Date.now();
  enviar({tipo:"jugada",mesa,pozo:fichasEnPozo,movimientos,gano,numeroTurno,conteo:fichasAtril().length,ts:turnoInicioTS,tiempoRestante});
  if(gano){ victorias[miId()]++; actualizarMarcador(); }
  actualizarUI(); guardar();
  if(gano) finPartida(true);
}
function robar(){
  if(!esMiTurno()||partidaTerminada) return;
  if(fichasEnPozo<=0){ alert("El pozo está vacío"); return; }
  atril=JSON.parse(JSON.stringify(atrilInicioTurno)); mesa=JSON.parse(JSON.stringify(mesaInicioTurno)); movimientos=[];
  limpiarSeleccion(); limpiarValidacion();
  if(esAnfitrion){
    const f=pozoReal.shift()||null; if(f) ponerEnAtril(f);
    fichasEnPozo=pozoReal.length;
    if(relojTipo==="ajedrez"){
      const elapsed=Math.floor((Date.now()-(turnoInicioTS||Date.now()))/1000);
      tiempoRestante[miId()]=Math.max(0,(tiempoRestante[miId()]||0)-elapsed);
    }
    numeroTurno++;
    turnoInicioTS=Date.now();
    enviar({tipo:"jugada",mesa,pozo:fichasEnPozo,movimientos:[],robo:true,numeroTurno,conteo:fichasAtril().length,ts:turnoInicioTS,tiempoRestante});
    iniciarTurnoSiCorresponde(); render(); actualizarUI(); guardar();
  } else { enviar({tipo:"pedirFicha"}); log("⏳ Pidiendo ficha..."); }
}
function mostrarValidacion(ok,t){ const m=$('msgValidacion'); m.textContent=t; m.className=ok?"bueno":"malo"; m.classList.remove('oculto'); }
function limpiarValidacion(){ $('msgValidacion').classList.add('oculto'); document.querySelectorAll('.celda.invalida').forEach(c=>c.classList.remove('invalida')); }
function resaltarInvalidas(cs){ document.querySelectorAll('.celda.invalida').forEach(c=>c.classList.remove('invalida'));
  cs.forEach(i=>{ const c=document.querySelector('#mesa .celda[data-celda="'+i+'"]'); if(c)c.classList.add('invalida'); }); }

/* ---------- Reproducir jugada ---------- */
async function reproducirJugada(msg){
  reproduciendo=true; inicioReproduccion=Date.now(); actualizarUI();
  try{
    if(!document.hidden){
      for(const m of (msg.movimientos||[])){
        if(m.origenMesa!=null) mesa[m.origenMesa]=null;
        if(m.destino!=null) mesa[m.destino]=m.ficha;
        renderMesa();
        if(m.destino!=null){
          const c=document.querySelector('#mesa .celda[data-celda="'+m.destino+'"]');
          if(c) c.classList.add("replay");
          await esperar(VEL_REPLAY);
          if(c) c.classList.remove("replay");
        }
        if(document.hidden) break;
      }
    }
  } catch(e){ }
  finally{
    mesa=msg.mesa; fichasEnPozo=msg.pozo; numeroTurno=msg.numeroTurno;
    turnoInicioTS=msg.ts||Date.now(); if(msg.tiempoRestante) tiempoRestante=msg.tiempoRestante;
    if(msg.conteo!=null) contadorRival=msg.conteo;
    reproduciendo=false;
    if(msg.gano){
      victorias[rivalId()]++;
      if(modoJuego==="puntaje"){
        const p=calcularPuntosAtril();
        puntos[miId()]=(puntos[miId()]||0)+p;
        enviar({tipo:"resultadoMano", perdedorId:miId(), puntos:p});
        comprobarFinSerie();
      }
      actualizarMarcador(); guardar();
      render(); actualizarUI(); finPartida(false); return;
    }
    actualizarMarcador();
    iniciarTurnoSiCorresponde(); render(); actualizarUI(); guardar();
  }
}
function esperar(ms){ return new Promise(r=>setTimeout(r,ms)); }

function finPartida(gane){
  partidaTerminada=true;
  const e=$('estadoTurno');
  if(serieTerminada){
    e.textContent = "🏁 Fin de la serie: gana "+nombres[ganadorSerie]+"!";
    e.className = "miTurno";
  } else {
    e.textContent = gane ? "🏆 ¡Ganó "+nombres[miId()]+"!" : "😔 Ganó "+nombres[rivalId()];
    e.className = gane?"miTurno":"turnoRival";
  }
  $('btnNuevaPartida').textContent = serieTerminada ? "🏆 Nueva serie" : "🔄 Nueva partida";
  ['btnDeshacer','btnEnviar','btnRobar'].forEach(id=>$(id).disabled=true);
  $('btnNuevaPartida').classList.remove('oculto');
  $('reloj').classList.add('oculto');
  soltarWakeLock(); try{ localStorage.removeItem(CLAVE); }catch(e){}
}

/* ---------- Latido + vigilante ---------- */
setInterval(()=>{
  if(!canalAbierto() || partidaTerminada || turnoInicial===null) return;
  enviar({tipo:"ping", numeroTurno});
}, 4000);
setInterval(()=>{
  if(reproduciendo && Date.now()-inicioReproduccion>15000){
    reproduciendo=false; actualizarUI();
    log("⚠️ Destrabado automático, sincronizando...");
    if(canalAbierto()) enviar({tipo:"pedirEstado"});
  }
}, 5000);

/* ---------- UI ---------- */
function actualizarUI(){
  const e=$('estadoTurno');
  if(partidaTerminada) return;
  const idEnTurno = turnoActual();
  const nombreEnTurno = idEnTurno ? (nombres[idEnTurno]||"...") : "...";
  if(reproduciendo){ e.textContent="👀 Mirando la jugada de "+nombreEnTurno+"..."; e.className="turnoRival"; }
  else if(esMiTurno()){ e.textContent="🟢 Tu turno, "+nombreEnTurno; e.className="miTurno"; }
  else { e.textContent="⏳ Turno de "+nombreEnTurno; e.className="turnoRival"; }
  $('abierto').textContent = yaAbri?"· ✅ abierto":"· 🔒 falta abrir (30)";
  const bloq=!esMiTurno()||reproduciendo;
  $('btnDeshacer').disabled=bloq; $('btnEnviar').disabled=bloq; $('btnRobar').disabled=bloq;
  $('mesa').classList.toggle('bloqueado',bloq);
}

/* ---------- Render ---------- */
function crearFichaDiv(f){
  const d=document.createElement("div"); d.className="ficha";
  if(f.comodin){ d.classList.add("comodin"); d.textContent="★"; }
  else { d.classList.add("c-"+f.color); d.textContent=f.num; }
  d.dataset.fid=f.id; hacerArrastrable(d,f); return d;
}
function render(){ renderAtril(); renderMesa(); }
function renderMesa(){
  const c=$('mesa'); c.innerHTML="";
  const idsNuevos = new Set();
  for(const m of movimientos){ if(m.desdeAtril && m.ficha) idsNuevos.add(m.ficha.id); }
  for(let i=0;i<MESA_CELDAS;i++){
    const cel=document.createElement("div"); cel.className="celda"; cel.dataset.celda=i; cel.dataset.zona="mesa";
    cel.addEventListener("click", ()=> manejarToqueCelda("mesa", i, !mesa[i]));
    const f=mesa[i];
    if(f){ const d=crearFichaDiv(f); d.dataset.origen="mesa"; d.dataset.celdaOrigen=i; cel.appendChild(d);
      if(idsNuevos.has(f.id)) cel.classList.add("nueva"); }
    c.appendChild(cel);
  }
}
function renderAtril(){
  const c=$('atril'); c.innerHTML="";
  for(let i=0;i<ATRIL_CELDAS;i++){
    const cel=document.createElement("div"); cel.className="celda"; cel.dataset.celda=i; cel.dataset.zona="atril";
    cel.addEventListener("click", ()=> manejarToqueCelda("atril", i, !atril[i]));
    const f=atril[i];
    if(f){ const d=crearFichaDiv(f); d.dataset.origen="atril"; d.dataset.celdaOrigen=i; cel.appendChild(d); }
    c.appendChild(cel);
  }
  $('cuenta').textContent=fichasAtril().length;
  $('pozo').textContent=fichasEnPozo;
}

/* ---------- Arrastre + Toque para mover ---------- */
let arrastre=null;
let seleccionada=null;

function limpiarSeleccion(){
  if(seleccionada && seleccionada.div) seleccionada.div.classList.remove("seleccionada");
  seleccionada=null;
}
function celdaBajoPunto(x,y){ const el=document.elementFromPoint(x,y); return el?el.closest(".celda"):null; }
function limpiarFantasmas(){
  document.querySelectorAll("body > .ficha").forEach(f=>f.remove());
  document.querySelectorAll(".ficha.arrastrando").forEach(f=>f.classList.remove("arrastrando"));
}

function hacerArrastrable(div,ficha){
  let arrastroDeVerdad=false;

  div.addEventListener("pointerdown",(e)=>{
    if(reproduciendo||partidaTerminada) return;
    if(div.dataset.origen==="mesa" && !esMiTurno()) return;
    e.preventDefault();
    arrastroDeVerdad=false;
    limpiarFantasmas();
    const r=div.getBoundingClientRect(); const fant=div.cloneNode(true);
    fant.style.position="fixed"; fant.style.zIndex=1000; fant.style.pointerEvents="none";
    fant.style.width=Math.max(r.width,34)+"px"; fant.style.height=Math.max(r.height,46)+"px";
    fant.style.fontSize="20px";
    fant.style.left=r.left+"px"; fant.style.top=r.top+"px";
    document.body.appendChild(fant);
    arrastre={ficha,div,fantasma:fant,offX:e.clientX-r.left,offY:e.clientY-r.top,
              origen:div.dataset.origen,celdaOrigen:parseInt(div.dataset.celdaOrigen),
              xInicio:e.clientX, yInicio:e.clientY};
    div.setPointerCapture(e.pointerId);
  });

  div.addEventListener("pointermove",(e)=>{
    if(!arrastre) return;
    const dist = Math.hypot(e.clientX-arrastre.xInicio, e.clientY-arrastre.yInicio);
    if(dist > 8){
      if(!arrastroDeVerdad){ arrastroDeVerdad=true; arrastre.div.classList.add("arrastrando"); }
      arrastre.fantasma.style.left=(e.clientX-arrastre.offX)+"px";
      arrastre.fantasma.style.top=(e.clientY-arrastre.offY)+"px";
      document.querySelectorAll(".celda.resaltada").forEach(c=>c.classList.remove("resaltada"));
      const c=celdaBajoPunto(e.clientX,e.clientY); if(c) c.classList.add("resaltada");
    }
  });

  const finArrastre=(e)=>{
    if(!arrastre) return;
    limpiarFantasmas();
    document.querySelectorAll(".celda.resaltada").forEach(c=>c.classList.remove("resaltada"));
    if(arrastroDeVerdad){
      const cel=celdaBajoPunto(e.clientX,e.clientY);
      if(cel) soltar(cel.dataset.zona, parseInt(cel.dataset.celda));
    } else {
      manejarToqueFicha(ficha, div);
    }
    arrastre=null; arrastroDeVerdad=false;
  };
  div.addEventListener("pointerup", finArrastre);
  div.addEventListener("pointercancel",()=>{ limpiarFantasmas(); document.querySelectorAll(".celda.resaltada").forEach(c=>c.classList.remove("resaltada")); arrastre=null; arrastroDeVerdad=false; });
}

function manejarToqueFicha(ficha, div){
  if(reproduciendo||partidaTerminada) return;
  const origen = div.dataset.origen;
  if(origen==="mesa" && !esMiTurno()) return;
  if(seleccionada && seleccionada.ficha.id===ficha.id){ limpiarSeleccion(); return; }
  limpiarSeleccion();
  seleccionada = { ficha, origen, celdaOrigen: parseInt(div.dataset.celdaOrigen), div };
  div.classList.add("seleccionada");
}

function manejarToqueCelda(zona, destino, celdaVacia){
  if(!seleccionada) return;
  if(!celdaVacia) return;
  const { ficha, origen, celdaOrigen } = seleccionada;
  if(zona==="mesa"){
    if(!esMiTurno()){ limpiarSeleccion(); return; }
    if(origen==="atril"){ atril[celdaOrigen]=null; mesa[destino]=ficha; movimientos.push({ficha,destino,desdeAtril:true}); }
    else { mesa[celdaOrigen]=null; mesa[destino]=ficha; movimientos.push({ficha,destino,origenMesa:celdaOrigen}); }
  } else {
    if(origen!=="atril"){ mostrarValidacion(false,"Lo que ya bajaste a la mesa no puede volver al atril."); limpiarSeleccion(); return; }
    atril[celdaOrigen]=null; atril[destino]=ficha;
  }
  limpiarSeleccion();
  limpiarValidacion(); render(); guardar();
}

function soltar(zona,destino){
  const f=arrastre.ficha, orig=arrastre.celdaOrigen, desde=arrastre.origen;
  if(zona==="mesa"){
    if(!esMiTurno()) return;
    if(mesa[destino]) return;
    if(desde==="atril"){ atril[orig]=null; mesa[destino]=f; movimientos.push({ficha:f,destino,desdeAtril:true}); }
    else { if(orig===destino) return; mesa[orig]=null; mesa[destino]=f; movimientos.push({ficha:f,destino,origenMesa:orig}); }
  } else {
    if(desde!=="atril"){ mostrarValidacion(false,"Lo que ya bajaste a la mesa no puede volver al atril."); return; }
    if(atril[destino]) return;
    atril[orig]=null; atril[destino]=f;
  }
  limpiarValidacion(); render(); guardar();
}

/* ---------- Volver de segundo plano ---------- */
let ultimoPedido=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    pedirWakeLock();
    limpiarFantasmas();
    if(reproduciendo){ reproduciendo=false; actualizarUI(); }
    if(!canalAbierto() && codigoRival && !esAnfitrion) dispararReintentoAuto();
    const ahora=Date.now();
    if(ahora-ultimoPedido<3000) return;
    ultimoPedido=ahora;
    if(canalAbierto()) enviar({tipo:"pedirEstado"});
  }
});
window.addEventListener("beforeunload",(e)=>{ const g=cargarGuardado(); if(g&&g.hayJuego){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("load",()=>{
  const g=cargarGuardado();
  if(g&&g.hayJuego){
    atril=g.atril||new Array(ATRIL_CELDAS).fill(null);
    mesa=g.mesa||new Array(MESA_CELDAS).fill(null);
    fichasEnPozo=g.fichasEnPozo; turnoInicial=g.turnoInicial; numeroTurno=g.numeroTurno||0;
    esAnfitrion=g.esAnfitrion; yaAbri=!!g.yaAbri; pozoReal=g.pozoReal||[]; recuperado=true;
    nombres=g.nombres||{A:"Jugador A",B:"Jugador B"};
    modoJuego=g.modoJuego||"conteo"; limitePuntaje=g.limitePuntaje||100;
    victorias=g.victorias||{A:0,B:0}; puntos=g.puntos||{A:0,B:0};
    serieTerminada=!!g.serieTerminada; ganadorSerie=g.ganadorSerie||null;
    contadorRival=g.contadorRival!=null?g.contadorRival:14;
    relojTipo=g.relojTipo||"ninguno"; relojArenaSeg=g.relojArenaSeg||60; relojAjedrezMin=g.relojAjedrezMin||5;
    tiempoRestante=g.tiempoRestante||{A:0,B:0}; turnoInicioTS=g.turnoInicioTS||Date.now();
    miCodigo=g.miCodigo||null; codigoRival=g.codigoRival||null;
    atrilInicioTurno=JSON.parse(JSON.stringify(atril)); mesaInicioTurno=JSON.parse(JSON.stringify(mesa));
    mostrarAviso("Reconectando automáticamente...");
    $('btnReconectar').classList.remove('oculto'); $('btnBorrar').classList.remove('oculto');
    if(miCodigo || codigoRival) reconectarSilencioso();
  }
});
</script>
